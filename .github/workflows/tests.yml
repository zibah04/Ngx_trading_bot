name: Tests and container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ngx-trading-bot:test .
      - run: docker run --rm --read-only --tmpfs /tmp ngx-trading-bot:test python -m unittest discover -s tests -v
      - run: python3 scripts/test_private_deployment.py --image ngx-trading-bot:test
