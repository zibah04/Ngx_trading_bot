services:
  dashboard:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      NGX_DATABASE_PATH: /app/data/ngx_dashboard.db
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ngx-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ngx-data:
